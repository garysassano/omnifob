[package]
name = "omnifob"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "authentication"]
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
dialoguer = { version = "0.12.0", default-features = false, features = ["fuzzy-select", "password"] }
futures-util.workspace = true
jiff.workspace = true
omnifob-core = { version = "0.14.0", path = "../omnifob-core" }
open = "5.4.5"
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "process", "rt", "signal"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
wiremock.workspace = true

[[bin]]
name = "fob"
path = "src/bin/fob.rs"

[[bin]]
name = "omnifob"
path = "src/bin/omnifob.rs"

[target."cfg(unix)".dependencies]
libc = "0.2.191"

# cargo binstall: the archives the release workflow publishes.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/omnifob-v{ version }-{ target }{ archive-suffix }"
bin-dir = "omnifob-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

# Linux releases are static musl builds only; binstall asks for the gnu target
# on a glibc system, so point it at the musl archive.
[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/omnifob-v{ version }-x86_64-unknown-linux-musl{ archive-suffix }"
bin-dir = "omnifob-v{ version }-x86_64-unknown-linux-musl/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/omnifob-v{ version }-aarch64-unknown-linux-musl{ archive-suffix }"
bin-dir = "omnifob-v{ version }-aarch64-unknown-linux-musl/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"
