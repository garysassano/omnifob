[package]
name = "omnifob"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "authentication"]
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
jiff = "0.2.40"
omnifob-core = { version = "0.6.1", path = "../omnifob-core" }
open = "5.4.5"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "process", "rt-multi-thread", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[[bin]]
name = "fob"
path = "src/bin/fob.rs"

[[bin]]
name = "omnifob"
path = "src/bin/omnifob.rs"

[target."cfg(unix)".dependencies]
libc = "0.2.191"

# cargo binstall: the archives the release workflow publishes.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/omnifob-v{ version }-{ target }{ archive-suffix }"
bin-dir = "omnifob-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"
