[package]
name = "omnifob-core"
version.workspace = true
edition.workspace = true
description = "Providers, configuration and keychain storage behind the omnifob command line"
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories = ["authentication"]
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
aws-lc-rs = "1.19.0"
aws-sdk-signin = { version = "1.36.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sso = { version = "1.119.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-ssooidc = { version = "1.121.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sts = { version = "1.124.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
base64 = "0.23.1"
form_urlencoded = "1.2.2"
futures = "0.3.34"
jiff = { version = "0.2.40", features = ["serde"] }
keyring-core = "1.0.1"
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "1.2.1"
toml_edit = "0.25.19"
tracing = "0.1.44"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils-keyring-store = "1.0.0"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }

[dev-dependencies]
schemars = "1.2.3"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync"] }
wiremock = "0.6.5"
