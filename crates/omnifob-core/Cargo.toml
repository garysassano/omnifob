[package]
name = "omnifob-core"
version.workspace = true
edition.workspace = true
description = "Providers, configuration and keychain storage behind the omnifob command line"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories = ["authentication"]
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
aws-lc-rs = "1.19.0"
aws-sdk-signin = { version = "1.36.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sso = { version = "1.119.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-ssooidc = { version = "1.121.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sts = { version = "1.129.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sigv4 = "1.6.6"
aws-smithy-xml = "0.64.1"
base64.workspace = true
form_urlencoded = "1.2.2"
futures-util.workspace = true
jiff = { workspace = true, features = ["serde"] }
keyring-core = "1.0.1"
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json.workspace = true
thiserror = "2.0.21"
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
toml = "1.2.1"
toml_edit = "0.25.19"
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils-keyring-store = "1.0.0"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }

[dev-dependencies]
schemars = "1.2.3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
wiremock.workspace = true
