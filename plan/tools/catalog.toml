# Tools in omnifob's space, for studying what to borrow and what to avoid.
#
# Each entry: repo (GitHub owner/name), category, scope (clouds or IdPs),
# why (what makes it worth a look), status, and optionally look_at (what to
# read when studying it) and notes. Live data (stars, last push, archived) is
# not stored here; run plan/tools/refresh.sh for it.
#
# status: "studied" (read, findings in research.md or landscape.md),
#         "to-study" (worth reading), "reference" (known, no study planned).
#
# Categories:
#   credential-manager  local sign-in, session and profile managers for people
#   idp-federation      sign in through an external IdP (SAML/OIDC) to get cloud credentials
#   provider-cli        a provider's official CLI, studied for how it signs in
#   secrets             secret managers and credential brokers
#   kubernetes          cluster authentication helpers and operators
#   access-platform     server-side access portals

# --- credential managers ---------------------------------------------------

