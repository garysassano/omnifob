name: Release

# Pushing a tag like v0.1.0 builds fob and omnifob for each platform and
# publishes them as a GitHub release with checksums and build provenance.
# Asset names carry the Rust target triple, which mise's github: backend
# understands: `mise use github:garysassano/omnifob`.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} && rustup default stable
      - name: Build
        run: cargo build --locked --release --bins --target ${{ matrix.target }}
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          name="omnifob-${TAG}-${TARGET}"
          mkdir -p "dist/$name"
          ext=""
          [[ "$TARGET" == *windows* ]] && ext=".exe"
          cp "target/$TARGET/release/fob$ext" "target/$TARGET/release/omnifob$ext" README.md LICENSE "dist/$name/"
          cd dist
          if [[ "$TARGET" == *windows* ]]; then
            7z a -bd "$name.zip" "$name" >/dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -r "$name"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
        # The notes are the signed tag's message after its first line. Tags
        # are created with --cleanup=verbatim so Markdown headings survive.
        run: |
          git fetch --no-tags --depth=1 origin "+refs/tags/$TAG:refs/tags/$TAG"
          git tag -l --format='%(contents:body)' "$TAG" | sed '/./,$!d' > notes.md
          cat notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -s notes.md ]; then
            notes=(--notes-file notes.md)
          else
            echo "::warning::tag $TAG has no release notes in its message; using generated notes"
            notes=(--generate-notes)
          fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" "${notes[@]}" --verify-tag
