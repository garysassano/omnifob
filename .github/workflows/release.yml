name: Release

# Pushing a tag like v0.1.0 builds fob and omnifob for each platform (see
# build.yml) and publishes them as a GitHub release with checksums and build
# provenance: `mise use github:garysassano/omnifob`. Running it by hand
# (workflow_dispatch) builds every target without publishing anything.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
        # The notes are the signed tag's message after its first line. Tags
        # are created with --cleanup=verbatim so Markdown headings survive.
        run: |
          git fetch --no-tags --depth=1 origin "+refs/tags/$TAG:refs/tags/$TAG"
          git tag -l --format='%(contents:body)' "$TAG" | sed '/./,$!d' > notes.md
          cat notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -s notes.md ]; then
            notes=(--notes-file notes.md)
          else
            echo "::warning::tag $TAG has no release notes in its message; using generated notes"
            notes=(--generate-notes)
          fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" "${notes[@]}" --verify-tag
